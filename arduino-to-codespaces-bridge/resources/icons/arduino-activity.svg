<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_1" xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 24 24">
  <!-- Arduino Bridge Activity Bar Icon - simplified microcontroller glyph -->
  <!-- Designed to match VS Code codicon weight: bold, simple, single concept -->
  <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Chip body -->
    <rect x="5.5" y="5.5" width="13" height="13" rx="1.75"/>
    <!-- Top pins -->
    <path d="M8.25 5.5 V2.75 M12 5.5 V2.75 M15.75 5.5 V2.75"/>
    <!-- Bottom pins -->
    <path d="M8.25 18.5 V21.25 M12 18.5 V21.25 M15.75 18.5 V21.25"/>
    <!-- Left pins -->
    <path d="M5.5 8.25 H2.75 M5.5 12 H2.75 M5.5 15.75 H2.75"/>
    <!-- Right pins -->
    <path d="M18.5 8.25 H21.25 M18.5 12 H21.25 M18.5 15.75 H21.25"/>
  </g>
  <!-- Pin 1 indicator -->
  <circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/>
</svg>
